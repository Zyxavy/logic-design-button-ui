<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrial LED Master Control Panel</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div class="app-wrapper">

<!-- SIMPLE MODE -->
<div class="panel" id="simple-mode">
  <div class="screw s-tl"></div><div class="screw s-tr"></div>
  <div class="screw s-bl"></div><div class="screw s-br"></div>
  <div class="panel-header">
    <button class="back-btn">←</button>
    <span class="panel-title">Simple Mode LED Control</span>
  </div>
   <div class="simple-body daynight-body">
    <div class="time-badge">TIME: 9:30 AM</div>
    <div class="sky-track" id="sky-track">
      <div class="sun" id="sun"></div>
      <div class="moon" id="moon"></div>
      <div class="orbit-arrow orbit-arrow-up">↗</div>
      <div class="orbit-arrow orbit-arrow-down">↙</div>
    </div>
    <div class="toggle-card" onclick="togglePower()">
      <div class="toggle-pill" id="toggle-pill"><div class="toggle-knob" id="toggle-knob"></div></div>
      <div class="toggle-labels"><span>ON</span><span>OFF</span></div>
    </div>
    <div class="simple-controls">

      < <div class="ind-btn" id="btn-strobe" onclick="toggleStrobe()"><div class="idot" id="dot-strobe"></div><div class="ind-btn-housing"><span class="ind-btn-text">STROBE</span></div></div>
      <div class="ind-btn" id="btn-blink" onclick="toggleBlink()"><div class="idot" id="dot-blink"></div><div class="ind-btn-housing"><span class="ind-btn-text">BLINK</span></div></div>
      <button class="advance-btn" onclick="switchToAdvanced()">ADVANCED</button>

    </div>
    <div class="adv-row">
    </div>
  </div>
</div>

<!-- ADVANCED MODE -->
<div class="panel" id="advanced-mode">
  <div class="screw s-tl"></div><div class="screw s-tr"></div>
  <div class="screw s-bl"></div><div class="screw s-br"></div>
  <div class="panel-header">
    <button class="back-btn" onclick="switchToSimple()">←</button>
    <span class="panel-title">Industrial LED Master Control Panel</span>
  </div>
  <div class="adv-body">
    <!-- LEFT -->
    <div class="adv-left">
      <div class="inset">
        <div class="slabel">Master Power</div>
        <div class="adv-toggle-row">
          <div class="adv-rocker-wrap" onclick="togglePowerAdv()">
            <svg id="adv-rocker-svg" viewBox="0 0 48 70" width="48" height="70">
              <defs>
                <linearGradient id="ahg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#2e2e2e"/><stop offset="100%" stop-color="#141414"/>
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="44" height="66" rx="6" fill="url(#ahg)" stroke="#080808" stroke-width="1.5"/>
              <rect x="8" y="6" width="32" height="58" rx="4" fill="#111" stroke="#080808" stroke-width="1"/>
              <rect x="8" y="6" width="32" height="8" rx="3" fill="rgba(0,0,0,0.5)"/>
              <g id="adv-lever-g" transform="rotate(16,24,35)">
                <rect x="11" y="10" width="26" height="50" rx="5" fill="url(#lg-off)" stroke="#5a0a0a" stroke-width="1" filter="url(#ls)"/>
                <rect x="13" y="12" width="22" height="16" rx="4" fill="rgba(255,100,100,0.1)"/>
                <line x1="14" y1="33" x2="34" y2="33" stroke="#601010" stroke-width="1" opacity=".7"/>
                <line x1="14" y1="37" x2="34" y2="37" stroke="#601010" stroke-width="1" opacity=".7"/>
                <rect x="11" y="10" width="4" height="50" rx="2" fill="rgba(255,255,255,0.04)"/>
              </g>
            </svg>
          </div>
          <div class="adv-power-info">
            <div class="adv-status" id="adv-status">OFF</div>
            <div style="font-size:8px;color:#333;letter-spacing:1.5px;text-transform:uppercase">MASTER POWER</div>
          </div>
        </div>
      </div>
      <div class="inset">
        <div class="slabel">Core Controls</div>
        <div class="slabel" style="text-align:left;font-size:8px;margin-bottom:3px">BRIGHTNESS</div>
        <div class="slider-row">
          <span class="slr-lbl">0</span>
          <input type="range" class="isl" id="br-sl" min="0" max="100" value="75" oninput="updateBrightness(this.value)">
          <span class="slr-lbl">100</span>
        </div>
        <div class="hue-rgb-row">
          <div>
            <div class="slabel" style="text-align:left;font-size:8px;margin-bottom:4px">RGB HUE</div>
            <div class="hue-wheel-box">
              <canvas id="hue-canvas" width="72" height="72"></canvas>
              <div class="hue-ind" id="hue-ind"></div>
            </div>
          </div>
          <div class="vert-sliders">
            <div class="vs-wrap"><input type="range" class="vsl" id="rs" min="0" max="255" value="255" oninput="updateColor()"><span class="vsl-lbl" style="color:#ff4444">R</span></div>
            <div class="vs-wrap"><input type="range" class="vsl" id="gs" min="0" max="255" value="176" oninput="updateColor()"><span class="vsl-lbl" style="color:#44ff88">G</span></div>
            <div class="vs-wrap"><input type="range" class="vsl" id="bs" min="0" max="255" value="0" oninput="updateColor()"><span class="vsl-lbl" style="color:#4488ff">B</span></div>
          </div>
        </div>
      </div>
    </div>
    <!-- MIDDLE -->
    <div class="adv-middle">
      <div class="inset">
        <div class="slabel">Presets &amp; Patterns</div>
        <div class="preset-grid">
          <button class="pbtn" onclick="pressBtnFx(this)">SAVE</button>
          <button class="pbtn" onclick="pressBtnFx(this)">LOAD</button>
          <button class="pbtn" onclick="pressBtnFx(this);setMode('strobe',this)">STROBE</button>
          <button class="pbtn" onclick="pressBtnFx(this);setMode('fade',this)">FADE</button>
          <button class="pbtn" onclick="pressBtnFx(this);setMode('rainbow',this)">RAINBOW</button>
          <button class="pbtn" onclick="pressBtnFx(this);setMode('police',this)">POLICE</button>
        </div>
      </div>
      <div class="inset">
        <div class="knob-wrap">
          <div class="knob" id="pk" onmousedown="startDrag(event,'pk')"><div class="kdot" id="pk-dot"></div></div>
          <div class="slabel" style="margin:0">PULSE RATE</div>
        </div>
      </div>
      <div class="inset">
        <div class="slabel">Fancy Modes</div>
        <div class="fancy-btns">
          <button class="fbtn" onclick="setMode('candle',this)">CANDLE</button>
          <button class="fbtn" onclick="setMode('sunrise',this)">SUNRISE</button>
          <button class="fbtn" onclick="setMode('music',this)">MUSIC REACTIVE</button>
          <button class="fbtn" onclick="setMode('temp',this)">TEMPERATURE MAP</button>
        </div>
      </div>
    </div>
    <!-- RIGHT -->
    <div class="adv-right">
      <div class="inset">
        <div class="big-seg off-state" id="adv-seg">075</div>
        <div class="slabel" style="margin-top:6px">BRIGHTNESS VALUE</div>
      </div>
      <div class="inset"><div class="lcd" id="lcd">HEX: #FFB000<br>LEVEL: 75%</div></div>
      <div class="inset" style="flex:1">
        <div class="big-knob-section">
          <div class="bknob" id="bk" onmousedown="startDrag(event,'bk')">
            <div class="bknob-ring"></div>
            <div class="bkdot" id="bk-dot"></div>
          </div>
          <div class="slabel" style="margin:0">MANUAL BRIGHTNESS DIAL</div>
        </div>
      </div>
      <div class="adv-foot">
        <div class="status-pill"><div class="sdot"></div><span>COM3 LINKED</span></div>
        <div class="cprev" id="cprev"></div>
      </div>
    </div>
  </div>
</div>

<div id="scan-line"></div>
</div>

<script src="src/main.js"></script>
</body>
</html>
