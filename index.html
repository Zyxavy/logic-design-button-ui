<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LED UI - Simple Mode</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>

    <svg class="bg" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="10" cy="10" r="0.75" fill="#a8b4be" opacity="0.45"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
    </svg>

    <!-- Beat flash overlay (full screen tint on strong beats) -->
    <div id="beatFlashOverlay" class="beat-flash-overlay"></div>

    <main class="ui" id="appRoot" data-mode="simple">
      <!--  Serial Bar  -->
      <div class="serial-bar">
        <span class="serial-dot disconnected" id="serialDot"></span>
        <span class="serial-label">ARDUINO</span>
        <button id="serialConnectBtn" class="serial-btn" type="button">CONNECT</button>
      </div>

      <section class="simple-view" id="simpleView">
        <section class="time-pill" aria-live="polite">TIME: <span id="clock">--:-- --</span></section>

        <section class="scene" aria-label="Sun and moon cycle display">
          <div id="sun" class="celestial sun" aria-hidden="true">☀</div>
          <div id="moon" class="celestial moon" aria-hidden="true">☾</div>
          <button id="powerToggle" class="toggle" type="button" aria-pressed="true">
            <span class="knob"></span>
          </button>
          <div class="labels" aria-hidden="true">
            <span>ON</span>
            <span>OFF</span>
          </div>
        </section>

        <section class="modes" aria-label="Mode buttons">
          <button id="advancedBtn" type="button" class="mode-btn">ADVANCED</button>
        </section>

        <!--  Timer Panel  -->
        <section class="timer-panel" aria-label="Auto-off timer">
          <div class="timer-title">⏱ AUTO-OFF TIMER</div>
          <div class="timer-presets">
            <button class="timer-btn" data-mins="1">1 MIN</button>
            <button class="timer-btn" data-mins="5">5 MIN</button>
            <button class="timer-btn" data-mins="15">15 MIN</button>
            <button class="timer-btn" data-mins="30">30 MIN</button>
            <button class="timer-btn" data-mins="60">1 HR</button>
          </div>
          <div class="timer-custom-row">
            <input id="timerCustom" class="timer-custom-input" type="number" min="1" max="999" placeholder="min" />
            <button id="timerCustomSet" class="timer-set-btn">SET</button>
            <button id="timerCancel" class="timer-cancel-btn" hidden>CANCEL</button>
          </div>
          <div id="timerCountdown" class="timer-countdown" hidden></div>
        </section>
      </section>

      <section class="advanced-view" id="advancedView" aria-label="Advanced controls" hidden>
        <div class="advanced-card">
          <div class="adv-row">
            <!-- Power -->
            <div class="adv-panel adv-power">
              <h2>MASTER POWER</h2>
              <button class="toggle small" type="button" aria-pressed="true"><span class="knob"></span></button>
            </div>

            <!-- Core controls -->
            <div class="adv-panel adv-core">
              <h2>CORE CONTROLS</h2>
              <div class="picker-wrap">
                <canvas id="colorWheel" class="color-wheel" width="160" height="160" aria-label="Colour wheel"></canvas>
                <canvas id="svSquare"   class="sv-square"   width="120" height="120" aria-label="Saturation/brightness picker"></canvas>
              </div>
              <div class="rgb-sliders">
                <label class="rgb-row"><span class="rgb-lbl r-lbl">R</span><input id="sliderR" type="range" min="0" max="255" value="255" class="rgb-range r-range"><span id="valR" class="rgb-val">255</span></label>
                <label class="rgb-row"><span class="rgb-lbl g-lbl">G</span><input id="sliderG" type="range" min="0" max="255" value="176" class="rgb-range g-range"><span id="valG" class="rgb-val">176</span></label>
                <label class="rgb-row"><span class="rgb-lbl b-lbl">B</span><input id="sliderB" type="range" min="0" max="255" value="0"   class="rgb-range b-range"><span id="valB" class="rgb-val">000</span></label>
              </div>
              <label for="brightnessSlider" class="slider-label">BRIGHTNESS</label>
              <input id="brightnessSlider" class="brightness-slider" type="range" min="0" max="100" value="75" step="1" />
              <label for="speedSlider" class="slider-label speed-label">
                SPEED <span id="speedVal" class="speed-val">5</span>
              </label>
              <input id="speedSlider" class="speed-slider" type="range" min="1" max="10" value="5" step="1" />
            </div>

            <!-- Display + timer -->
            <div class="adv-panel adv-display">
              <h2>DISPLAYS</h2>
              <div id="colorSwatch" class="color-swatch"></div>
              <div class="monitor" style="margin-top:10px">
                <div id="hexValue">HEX: #FFB000</div>
                <div id="levelValue">LEVEL: 75%</div>
                <div id="rgbValue">RGB: 255,176,000</div>
              </div>
              <!-- Compact timer in advanced panel -->
              <div class="adv-timer">
                <div class="timer-title small-title">⏱ AUTO-OFF</div>
                <div class="timer-presets small-presets">
                  <button class="timer-btn" data-mins="1">1m</button>
                  <button class="timer-btn" data-mins="5">5m</button>
                  <button class="timer-btn" data-mins="15">15m</button>
                  <button class="timer-btn" data-mins="30">30m</button>
                  <button class="timer-btn" data-mins="60">1h</button>
                </div>
                <div id="advTimerCountdown" class="timer-countdown adv-countdown" hidden></div>
                <button id="advTimerCancel" class="timer-cancel-btn adv-cancel" hidden>✕ CANCEL</button>
              </div>
            </div>
          </div>

          <!-- Standard modes row -->
          <div class="adv-row adv-buttons">
            <button class="adv-btn" type="button">STROBE</button>
            <button class="adv-btn" type="button">FADE</button>
            <button class="adv-btn" type="button">RAINBOW</button>
            <button class="adv-btn" type="button">POLICE</button>
          </div>
          <div class="adv-row adv-buttons">
            <button class="adv-btn new-mode" type="button">DISCO</button>
            <button class="adv-btn new-mode" type="button">HEARTBEAT</button>
            <button class="adv-btn new-mode" type="button">THUNDER</button>
          </div>
          <div class="adv-row adv-buttons wide">
            <button class="adv-btn" type="button">CANDLE</button>
            <button class="adv-btn" type="button">SUNRISE</button>
          </div>
          <div class="adv-row adv-buttons wide">
            <button class="adv-btn new-mode" type="button">SOS</button>
            <button class="adv-btn new-mode" type="button">BREATHE</button>
            <button class="adv-btn new-mode" type="button">PARTY</button>
          </div>

          <!-- MUSIC / BEAT SYNC button -->
          <div class="adv-row adv-buttons wide" style="margin-bottom:4px">
            <button id="beatSyncBtn" class="adv-btn beat-mode" type="button">MUSIC/BEAT SYNC</button>
          </div>

          <!-- Beat Sync Panel (hidden until activated) -->
          <div id="beatSyncPanel" class="beat-sync-panel" hidden>
            <div class="beat-header">
              <span class="beat-title">BEAT SYNC</span>
              <div class="beat-status-row">
                <span class="beat-status-dot" id="beatDot"></span>
                <span id="beatStatusText">IDLE</span>
                <button class="beat-mic-btn" id="beatMicBtn" type="button">START MIC</button>
              </div>
            </div>

            <!-- Waveform display -->
            <div class="beat-wave-wrap">
              <div class="beat-wave-grid"></div>
              <div class="beat-center-line"></div>
              <canvas id="beatWaveCanvas" width="600" height="90" aria-label="Audio waveform monitor"></canvas>
            </div>

            <!-- Meters -->
            <div class="beat-meters">
              <div class="beat-meter">
                <div class="beat-meter-label">AMPLITUDE</div>
                <div class="beat-meter-value" id="beatAmpVal">0</div>
                <div class="beat-bar-wrap"><div class="beat-bar-fill" id="beatAmpBar"></div></div>
              </div>
              <div class="beat-meter">
                <div class="beat-meter-label">PEAK</div>
                <div class="beat-meter-value" id="beatPeakVal">0</div>
                <div class="beat-bar-wrap"><div class="beat-bar-fill peak" id="beatPeakBar"></div></div>
              </div>
              <div class="beat-meter">
                <div class="beat-meter-label">BPM EST.</div>
                <div class="beat-meter-value" id="beatBpmVal">--</div>
                <div class="beat-bar-wrap"><div class="beat-bar-fill" id="beatBpmBar" style="background:#3ecf5a"></div></div>
              </div>
            </div>

            <!-- Controls -->
            <div class="beat-controls">
              <span class="beat-ctrl-label">SENSITIVITY</span>
              <input type="range" class="beat-range" id="beatSensitivity" min="1" max="10" value="5" step="1" />
              <span class="beat-ctrl-val" id="beatSensVal">5</span>

              <span class="beat-ctrl-label" style="margin-left:10px">MIN BRIGHT</span>
              <input type="range" class="beat-range" id="beatMinBright" min="0" max="50" value="5" step="1" />
              <span class="beat-ctrl-val" id="beatMinVal">5</span>
            </div>
          </div>

          <div class="back-wrap" style="margin-top:10px">
            <button id="backToSimpleBtn" class="back-btn" type="button">BACK TO SIMPLE MODE</button>
          </div>
        </div>
      </section>
    </main>

    <!-- Tooltip -->
    <div id="modeTooltip" class="mode-tooltip" style="display:none"></div>

    <script src="src/main.js"></script>
  </body>
</html>
